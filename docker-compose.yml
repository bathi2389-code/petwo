version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - HOST=0.0.0.0
      - FIREBASE_PROJECT_ID=petwo-prod
      - FIREBASE_PRIVATE_KEY_ID=mock-key-id
      - FIREBASE_PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0mockkey...\n-----END RSA PRIVATE KEY-----\n"
      - FIREBASE_CLIENT_EMAIL=mock@petwo-prod.iam.gserviceaccount.com
      - FIREBASE_CLIENT_ID=mock-client-id
      - FIREBASE_STORAGE_BUCKET=petwo-prod.appspot.com
      - JWT_SECRET=supersecretproductiongradekey123456789
      - RAZORPAY_KEY_ID=rzp_test_1234567890abcdef
      - RAZORPAY_KEY_SECRET=rzp_secret_abcdef1234567890
      - RAZORPAY_WEBHOOK_SECRET=rzp_webhook_secret_998877
    restart: unless-stopped

  provider-web:
    build:
      context: .
      dockerfile: apps/provider-web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
