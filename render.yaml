services:
  - type: web
    name: petco-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build --workspace=@petco/shared && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder
      - key: RAZORPAY_KEY_SECRET
        value: rzp_secret_placeholder
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_webhook_secret_placeholder
      - key: FIREBASE_PROJECT_ID
        value: petco-prod
      - key: FIREBASE_CLIENT_EMAIL
        value: mock@petco-prod.iam.gserviceaccount.com
      - key: FIREBASE_STORAGE_BUCKET
        value: petco-prod.appspot.com
      - key: FIREBASE_PRIVATE_KEY
        value: "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0mockkey...\n-----END RSA PRIVATE KEY-----\n"

  - type: web
    name: petco-provider-web
    env: node
    plan: free
    region: singapore
    rootDir: apps/provider-web
    buildCommand: npm install && npm run build --workspace=@petco/shared && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: petco-backend
          type: web
          property: host

  - type: web
    name: petco-admin-web
    env: node
    plan: free
    region: singapore
    rootDir: apps/admin-web
    buildCommand: npm install && npm run build --workspace=@petco/shared && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: petco-backend
          type: web
          property: host
